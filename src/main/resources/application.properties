spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:mime_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

server.port=8080

app.seed.fakestore.enabled=${FAKESTORE_SEED_ENABLED:false}
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@mime.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
